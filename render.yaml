# Deploy on Render from a phone or computer: Dashboard > New > Blueprint > pick this repository.
# Render asks for the two secrets below; add LINE keys later under Environment if you use LINE.
services:
  - type: web
    name: smith-agent
    runtime: docker
    plan: starter # a persistent disk needs a paid instance; the free one loses data on every restart
    region: singapore
    healthCheckPath: /healthz
    disk:
      name: smith-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WEB_INVITE_CODE
        sync: false
      # The invite code is shared by everyone, so this is what caps the round: new accounts beyond it are turned
      # away (no account, no Claude call). Your own phones count. Raise it when you invite the next group.
      - key: MAX_USERS
        value: "30"
      # Trial credit: by default one medium job (= PRICE_M, ฿12), see founder/cfo.md.
      # - key: START_CREDIT
      #   value: "27"
      # Using OpenRouter credit instead of an Anthropic key: add OPENROUTER_API_KEY under Environment in the dashboard
      # (ANTHROPIC_API_KEY can then stay empty). The doctor command shows the credit left.
      # Optional: lets you download a copy of the database from /admin/backup (see the README). Add it under
      # Environment in the Render dashboard instead of here: a secret does not belong in this file.
      # - key: ADMIN_TOKEN
      #   sync: false
      # Optional: the most Claude cost (baht) accepted per day, all users together (default 500, 0 = no cap).
      # - key: DAILY_COST_CAP
      #   value: "500"
      # Optional: manual PromptPay top-ups. Users see the number and name; you approve each in the Shell after checking
      # your bank app (see the README). Ask your accountant about tax before turning it on.
      # - key: TOPUP_PROMPTPAY
      #   value: "0812345678"
      # - key: TOPUP_NAME
      #   value: "ชื่อบัญชีของคุณ"
      # Optional: change what a job costs, in whole baht (defaults 5 / 9 / 15). Uncomment and re-apply the Blueprint.
      # - key: PRICE_M
      #   value: "12"
